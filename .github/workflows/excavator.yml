# Keeps the manifests in bucket/ up to date: Scoop's checkver looks for a new release, autoupdate
# rewrites the manifest (version, url, hash) and the change is pushed to the default branch.
# For a GitHub release file the hash comes from the SHA-256 digest that GitHub lists for it.
# Adapted from https://github.com/ScoopInstaller/BucketTemplate/blob/master/.github/workflows/excavator.yml
# (actions pinned as in the template, 2026-08-24). Run it by hand from the Actions tab right after
# a release to skip the wait.
name: Excavator

on:
  workflow_dispatch:
  schedule:
    # every 4 hours
    - cron: '20 */4 * * *'

permissions:
  contents: write

jobs:
  excavate:
    name: Excavate
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Excavate
        uses: ScoopInstaller/GithubActions@5bceeda181721d9d10a18fdcc3ddca6f33467ae6 # v3.0.0
        env:
          SKIP_UPDATED: 1

  # GitHub disables a scheduled workflow in a public repository after 60 days without repository
  # activity, and this bucket only gets commits when a new release comes out. This job re-enables the
  # workflow through the API on every run, the same call liskin/gh-workflow-keepalive makes (the
  # action the scoop.sh indexer uses), so the schedule stays on without empty commits.
  keepalive:
    name: Keepalive
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Re-enable this workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${GITHUB_REPOSITORY}/actions/workflows/excavator.yml/enable"
